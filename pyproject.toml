[project]
name = "coder-buddy"
version = "0.2.0"
description = "Multi-agent (Planner, Architect, Coder) project generator built with LangGraph, with a Streamlit UI and local-LLM secure-coding scanner/fixer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.31.0",
    "langchain>=0.3.27",
    "langchain-core>=0.3.72",
    "langchain-groq>=0.3.7",
    "langchain-ollama>=0.3.6,<1.0",
    "langgraph>=0.6.3",
    "pip>=25.2",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: needs a running local Ollama server with a pulled model (skipped by default)",
]
addopts = "-m 'not ollama'"
